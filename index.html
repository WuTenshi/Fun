<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>&#8203;</title>
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  video{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:contain;background:#000;display:block;
  }
  .play{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:96px;height:96px;border-radius:50%;
    display:grid;place-items:center;
    padding:0 0 0 8px;
    border:1px solid rgba(255,255,255,.26);
    background:rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    color:#fff;font:30px/1 "Segoe UI",system-ui,sans-serif;
    cursor:pointer;z-index:2;
    transition:opacity .3s ease,transform .2s ease,background .2s ease;
  }
  .play:hover{background:rgba(255,255,255,.24)}
  .play.hide{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.88)}
  @media (max-width:640px){ .play{width:74px;height:74px;font-size:24px} }
</style>
</head>
<body>
<video id="video" playsinline preload="auto" controls></video>
<button id="play" class="play" aria-label="play">&#9654;</button>

<script>
(function () {
  "use strict";

  var FILE_NAME = "badapple.mp4";

  var video  = document.getElementById("video");
  var btn    = document.getElementById("play");
  var failed = false;

  var picker = document.createElement("input");
  picker.type = "file";
  picker.accept = "video/*";
  picker.style.display = "none";
  document.body.appendChild(picker);

  function showBtn() { btn.classList.remove("hide"); }
  function hideBtn() { btn.classList.add("hide"); }

  function tryPlay() {
    var p = video.play();
    if (p && typeof p.catch === "function") {
      p.catch(function () { showBtn(); });
    }
  }

  function toggle() {
    if (video.paused || video.ended) {
      if (video.ended) video.currentTime = 0;
      video.play().catch(function () { showBtn(); });
    } else {
      video.pause();
    }
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  }

  function useFile(file) {
    if (!file) return;
    failed = false;
    video.src = URL.createObjectURL(file);
    video.load();
    hideBtn();
    tryPlay();
  }

  btn.addEventListener("click", function () {
    if (failed) picker.click();
    else toggle();
  });

  picker.addEventListener("change", function () { useFile(picker.files && picker.files[0]); });

  video.addEventListener("play", function () { hideBtn(); });
  video.addEventListener("pause", function () { if (!video.ended) showBtn(); });
  video.addEventListener("ended", function () { showBtn(); });

  video.addEventListener("error", function () {
    failed = true;
    showBtn();
  });

  video.addEventListener("click", function (e) {
    var r = video.getBoundingClientRect();
    if (e.clientY > r.bottom - 56) return; // 底部控制条区域交给浏览器
    toggle();
  });
  video.addEventListener("dblclick", toggleFullscreen);

  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && /^video\//.test(f.type || "")) useFile(f);
  });

  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    switch (e.key) {
      case " ":
      case "Spacebar": e.preventDefault(); toggle(); break;
      case "ArrowLeft": e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); break;
      case "ArrowRight": e.preventDefault(); video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); break;
      case "ArrowUp": e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); break;
      case "ArrowDown": e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); break;
      case "m": case "M": video.muted = !video.muted; break;
      case "f": case "F": toggleFullscreen(); break;
    }
  });

  video.src = encodeURI(FILE_NAME);
  video.load();
  tryPlay();
})();
</script>
</body>
</html>
